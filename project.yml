name: DevOpsAssistant
options:
  bundleIdPrefix: com.vibeforge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: LPW4Z3BN69
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: NO
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 VibeForge"
    PRODUCT_NAME: DevOps Assistant

targets:
  DevOpsAssistant:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
