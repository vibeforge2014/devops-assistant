name: DevOpsAssistant
options:
  bundleIdPrefix: com.vibeforge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: LPW4Z3BN69
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 VibeForge"
    PRODUCT_NAME: DevOps Assistant

targets:
  DevOpsAssistant:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources

  DevOpsAssistantTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: Sources/Models/Project.swift
      - path: Sources/Models/Credential.swift
      - path: Sources/Models/ReleaseRecord.swift
      - path: Sources/Models/AppStoreInfo.swift
      - path: Sources/Models/AppUpdateInfo.swift
      - path: Sources/Models/PipelineStepState.swift
      - path: Sources/Services/VersionManager.swift
      - path: Sources/Services/OnboardingService.swift
      - path: Sources/Services/KeychainStore.swift
      - path: Sources/Services/ShellRunner.swift
      - path: Sources/Services/RunLogStore.swift
      - path: Sources/Services/PortalSync.swift
      - path: Sources/Services/ProjectCatalog.swift
      - path: Sources/Services/ProjectLocator.swift
      - path: Sources/Services/GitRemoteService.swift
      - path: Sources/Services/CredentialMaterializer.swift
      - path: Sources/Services/CredentialMigrationService.swift
      - path: Sources/Services/ReleaseFormatting.swift
      - path: Sources/Services/HistoryStore.swift
      - path: Sources/Services/PagesDeployer.swift
      - path: Sources/Services/ProcessCapture.swift
      - path: Sources/Services/SiteStatusService.swift
      - path: Sources/Services/SitePublishCoordinator.swift
    settings:
      base:
        PRODUCT_NAME: DevOpsAssistantTests
        PRODUCT_MODULE_NAME: DevOpsAssistantTests

schemes:
  DevOpsAssistant:
    build:
      targets:
        DevOpsAssistant: all
        DevOpsAssistantTests: [test]
    test:
      targets:
        - DevOpsAssistantTests
